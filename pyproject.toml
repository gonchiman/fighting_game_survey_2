[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fighting-game-survey"
version = "0.1.0"
description = "Tools for analyzing Steam fighting game player trends."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "matplotlib",
    "playwright",
    "lxml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["pytest"]
pythonpath = ["."]